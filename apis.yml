aid: clearbanc
name: Clearco
description: 'Clearco (formerly Clearbanc) is a Toronto-based fintech that provides
  non-dilutive, revenue-based working capital to ecommerce and direct-to-consumer brands.
  Founders connect the sales, advertising and banking platforms they already run on
  — Shopify, Amazon, Stripe, PayPal, Square, BigCommerce — and Clearco underwrites
  from that data, funding inventory and marketing spend as a cash advance or as invoice
  funding, in as little as 24 hours, without equity dilution. The company was founded
  in 2015 as Clearbanc, rebranded to Clearco in 2021, and reports having deployed more
  than $3.3 billion to over 10,000 businesses.'
